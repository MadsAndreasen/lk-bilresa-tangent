[project]
name = "lk-bilresa"
version = "0.1.0"
description = "Locked-ON LK NES/Fuga tangent with a seat for the IKEA BILRESA magnet plate"
requires-python = ">=3.11,<3.14"
dependencies = ["build123d>=0.9"]

[dependency-groups]
dev = ["pytest>=8"]
viewer = ["ocp_vscode"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lk_bilresa"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
default-groups = ["dev", "viewer"]
